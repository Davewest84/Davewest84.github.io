name: Send Morning Briefing

on:
  push:
    paths:
      - 'briefings/**'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install --quiet openai

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate MP3 from latest briefing text
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'EOF'
          import glob, os, tempfile, subprocess
          from openai import OpenAI

          files = sorted(glob.glob("briefings/*.txt"))
          if not files:
              print("No briefing files found.")
              raise SystemExit(0)

          latest = files[-1]
          with open(latest, encoding="utf-8") as f:
              text = f.read().strip()
          print(f"Generating MP3 from {latest} ({len(text)} chars)")

          # OpenAI tts-1: the voice is a FIXED identity, so multi-chunk audio keeps
          # the same voice and pace throughout. We switched off Gemini on 2026-06-17
          # because it RE-GENERATED its voice on each ~3,500-char chunk, so the voice
          # and speed audibly drifted mid-briefing (the opening salutation chunk in
          # particular sounded like a different, slower speaker). speed=0.95 gives a
          # steady, slightly-slowed read, applied natively by OpenAI (no ffmpeg tempo).
          VOICE = "fable"   # British newsreader tone
          MODEL = "tts-1"
          SPEED = 0.95
          MAX_CHARS = 4000  # OpenAI hard limit is 4096; leave margin

          def split_text(t, limit):
              paras = t.split("\n\n")
              chunks, cur = [], ""
              for p in paras:
                  if cur and len(cur) + len(p) + 2 > limit:
                      chunks.append(cur.strip()); cur = p
                  else:
                      cur = (cur + "\n\n" + p) if cur else p
              if cur.strip():
                  chunks.append(cur.strip())
              return chunks

          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
          os.makedirs("webpages", exist_ok=True)
          target = "webpages/morning-briefing.mp3"
          chunks = split_text(text, MAX_CHARS)
          print(f"Synthesising {len(chunks)} chunk(s) with voice {VOICE} via {MODEL} (speed={SPEED})")

          if len(chunks) == 1:
              client.audio.speech.create(
                  model=MODEL, voice=VOICE, input=chunks[0],
                  response_format="mp3", speed=SPEED,
              ).write_to_file(target)
          else:
              # Synthesise each chunk, then concat losslessly with ffmpeg. Safe
              # because every chunk is the same fixed voice at the same speed.
              part_files = []
              try:
                  for i, ch in enumerate(chunks):
                      p = tempfile.mktemp(suffix=f"_part{i}.mp3")
                      part_files.append(p)
                      client.audio.speech.create(
                          model=MODEL, voice=VOICE, input=ch,
                          response_format="mp3", speed=SPEED,
                      ).write_to_file(p)
                      print(f"  chunk {i+1}/{len(chunks)}: {len(ch)} chars -> {p}")
                  list_file = tempfile.mktemp(suffix=".txt")
                  with open(list_file, "w") as lf:
                      for p in part_files:
                          lf.write(f"file '{p}'\n")
                  subprocess.run(
                      ["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", list_file,
                       "-c", "copy", target],
                      check=True, capture_output=True,
                  )
                  os.remove(list_file)
              finally:
                  for p in part_files:
                      if os.path.isfile(p):
                          os.remove(p)

          size = os.path.getsize(target)
          print(f"MP3 generated: {target} ({size:,} bytes)")
          EOF

      - name: Commit & push MP3
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webpages/morning-briefing.mp3
          if git diff --cached --quiet; then
            echo "No MP3 changes to commit"
          else
            DATE=$(date -I)
            git commit -m "Morning briefing MP3 (remote) — ${DATE}"
            git push
          fi

      - name: Send briefing email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python - <<'EOF'
          import os, glob, smtplib, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          files = sorted(glob.glob("briefings/*.txt"))
          if not files:
              print("No briefing files found.")
              raise SystemExit(0)

          latest = files[-1]
          date_str = os.path.splitext(os.path.basename(latest))[0]
          with open(latest, encoding="utf-8") as f:
              briefing = f.read()

          try:
              display_date = datetime.datetime.strptime(date_str, "%Y-%m-%d").strftime("%a %-d %B")
          except ValueError:
              display_date = date_str

          mp3_url = "https://davewest84.github.io/webpages/morning-briefing.mp3"
          body = (
              f"\U0001F50A Listen to this briefing: {mp3_url}\n"
              f"---\n\n{briefing}"
          )

          msg = MIMEMultipart()
          msg["From"] = os.environ["SENDER_EMAIL"]
          msg["To"] = os.environ["RECIPIENT_EMAIL"]
          msg["Subject"] = f"Morning Briefing remote - {display_date}"
          msg.attach(MIMEText(body, "plain", "utf-8"))

          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls()
              s.login(os.environ["SENDER_EMAIL"], os.environ["SENDER_PASSWORD"])
              s.send_message(msg)
          print(f"Sent briefing for {date_str} to {os.environ['RECIPIENT_EMAIL']}")
          EOF
