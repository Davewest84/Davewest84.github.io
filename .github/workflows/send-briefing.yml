name: Send Morning Briefing

on:
  push:
    paths:
      - 'briefings/**'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install --quiet google-genai

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate MP3 from latest briefing text
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import glob, os, wave, tempfile, subprocess, time
          from google import genai
          from google.genai import types

          files = sorted(glob.glob("briefings/*.txt"))
          if not files:
              print("No briefing files found.")
              raise SystemExit(0)

          latest = files[-1]
          with open(latest, encoding="utf-8") as f:
              text = f.read().strip()
          print(f"Generating MP3 from {latest} ({len(text)} chars)")

          # Voice + steering. Schedar = "even" tone — BBC Radio 4-ish.
          # CRITICAL: apply the steering prompt to EVERY chunk. Without it
          # the model drifts to a default (US) accent at chunk boundaries —
          # caught on 2026-05-29 in the local trial.
          VOICE = "Schedar"
          MODEL = "gemini-2.5-flash-preview-tts"
          TONE_PREFIX = (
              "Read the following morning news briefing aloud in a measured, warm, "
              "British BBC newsreader voice. Natural pacing for radio, brief pauses at "
              "section breaks. Do not introduce yourself; just read.\n\n"
          )
          MAX_CHARS = 3500  # Gemini TTS handles ~4k cleanly; leave margin

          def split_text(t, limit):
              paras = t.split("\n\n")
              chunks, cur = [], ""
              for p in paras:
                  if cur and len(cur) + len(p) + 2 > limit:
                      chunks.append(cur.strip()); cur = p
                  else:
                      cur = (cur + "\n\n" + p) if cur else p
              if cur.strip():
                  chunks.append(cur.strip())
              return chunks

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          def synth(prompt: str) -> bytes:
              resp = client.models.generate_content(
                  model=MODEL,
                  contents=prompt,
                  config=types.GenerateContentConfig(
                      response_modalities=["AUDIO"],
                      speech_config=types.SpeechConfig(
                          voice_config=types.VoiceConfig(
                              prebuilt_voice_config=types.PrebuiltVoiceConfig(voice_name=VOICE)
                          )
                      ),
                  ),
              )
              return resp.candidates[0].content.parts[0].inline_data.data

          chunks = split_text(text, MAX_CHARS)
          print(f"Synthesising {len(chunks)} chunk(s) with voice {VOICE} via {MODEL}")
          all_pcm = bytearray()
          for i, ch in enumerate(chunks, 1):
              t0 = time.time()
              pcm = synth(TONE_PREFIX + ch)
              print(f"  chunk {i}/{len(chunks)}: {len(ch)} chars -> {len(pcm)} pcm bytes "
                    f"({time.time()-t0:.1f}s)")
              all_pcm.extend(pcm)

          # PCM (24kHz mono 16-bit) -> WAV -> MP3
          os.makedirs("webpages", exist_ok=True)
          target = "webpages/morning-briefing.mp3"
          wav_path = tempfile.mktemp(suffix=".wav")
          with wave.open(wav_path, "wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(24000)
              wf.writeframes(bytes(all_pcm))
          # atempo=0.95 slows Gemini's native pace ~5% — it tends to read a touch
          # fast and the speed drifts between chunks. Keeps it steadier/calmer.
          subprocess.run(
              ["ffmpeg", "-y", "-i", wav_path, "-filter:a", "atempo=0.95",
               "-codec:a", "libmp3lame", "-q:a", "4", target],
              check=True, capture_output=True,
          )
          os.remove(wav_path)

          size = os.path.getsize(target)
          print(f"MP3 generated: {target} ({size:,} bytes)")
          EOF

      - name: Commit & push MP3
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webpages/morning-briefing.mp3
          if git diff --cached --quiet; then
            echo "No MP3 changes to commit"
          else
            DATE=$(date -I)
            git commit -m "Morning briefing MP3 (remote) — ${DATE}"
            git push
          fi

      - name: Send briefing email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python - <<'EOF'
          import os, glob, smtplib, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          files = sorted(glob.glob("briefings/*.txt"))
          if not files:
              print("No briefing files found.")
              raise SystemExit(0)

          latest = files[-1]
          date_str = os.path.splitext(os.path.basename(latest))[0]
          with open(latest, encoding="utf-8") as f:
              briefing = f.read()

          try:
              display_date = datetime.datetime.strptime(date_str, "%Y-%m-%d").strftime("%a %-d %B")
          except ValueError:
              display_date = date_str

          mp3_url = "https://davewest84.github.io/webpages/morning-briefing.mp3"
          body = (
              f"\U0001F50A Listen to this briefing: {mp3_url}\n"
              f"---\n\n{briefing}"
          )

          msg = MIMEMultipart()
          msg["From"] = os.environ["SENDER_EMAIL"]
          msg["To"] = os.environ["RECIPIENT_EMAIL"]
          msg["Subject"] = f"Morning Briefing remote - {display_date}"
          msg.attach(MIMEText(body, "plain", "utf-8"))

          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls()
              s.login(os.environ["SENDER_EMAIL"], os.environ["SENDER_PASSWORD"])
              s.send_message(msg)
          print(f"Sent briefing for {date_str} to {os.environ['RECIPIENT_EMAIL']}")
          EOF
