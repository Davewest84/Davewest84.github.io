<script>
(function(){

var svg=root.querySelector('svg'),tip=root.querySelector('.tip'),xh=root.querySelector('.xh'),wrap=root.querySelector('.wrap');
var pts=root.querySelectorAll('.pt');
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function show(i){
  var c=pts[i],cx=+c.getAttribute('cx'),cy=+c.getAttribute('cy');
  for(var k=0;k<pts.length;k++)pts[k].setAttribute('r',k==i?7:5);
  xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('visibility','visible');
  tip.innerHTML=d[i].m+'<br><b>'+d[i].p.toFixed(1)+'%</b> answered within five working days<br>'+fmt(d[i].n)+' of '+fmt(d[i].t)+' requests';
  tip.style.display='block';
  var s=svg.getBoundingClientRect().width/W,px=cx*s,py=cy*s,tw=tip.offsetWidth;
  var left=px+12; if(left+tw>wrap.offsetWidth) left=px-tw-12;
  tip.style.left=left+'px'; tip.style.top=Math.max(0,py-tip.offsetHeight-10)+'px';
}
function hide(){tip.style.display='none';xh.setAttribute('visibility','hidden');for(var k=0;k<pts.length;k++)pts[k].setAttribute('r',5);}
root.querySelectorAll('.hit').forEach(function(h){
  var i=+h.getAttribute('data-i');
  h.addEventListener('mouseenter',function(){show(i)});
  h.addEventListener('touchstart',function(){show(i)},{passive:true});
});
svg.addEventListener('mouseleave',hide);
})();
</script>
