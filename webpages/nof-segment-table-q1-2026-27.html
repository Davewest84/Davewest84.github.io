  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function render(){
    var term=q.value.trim().toLowerCase(), mode=f.value, out=[], shown=0;
    NOFQ1[cur].rows.forEach(function(r){
      var rank=r[0],name=r[1],reg=r[2],h=[r[3],r[4],r[5],r[6]],p4=r[6],s1=r[7],ov=r[8];
      if(term && name.toLowerCase().indexOf(term)<0 && reg.toLowerCase().indexOf(term)<0) return;
      var d = (p4==null)?null:(p4-s1);
      if(mode==="moved" && !d) return;
      if(mode==="up" && !(d>0)) return;
      if(mode==="down" && !(d<0)) return;
      if(mode==="ovr" && !ov) return;
      if(mode==="s1" && s1!==1) return;
      if(mode==="s4" && s1!==4) return;
      shown++;
      var ch = d==null ? '<span class="nofq1-fl">-</span>'
             : d>0 ? '<span class="nofq1-up">&#9650; '+d+'</span>'
             : d<0 ? '<span class="nofq1-dn">&#9660; '+(-d)+'</span>'
             : '<span class="nofq1-fl">no change</span>';
      var hist=h.map(function(v){return '<td class="nofq1-num">'+seg(v)+'</td>';}).join("");
      out.push('<tr><td class="nofq1-num">'+rank+'</td>'
        +'<td class="nofq1-name">'+esc(name)+'</td>'
        +'<td class="nofq1-reg">'+esc(reg)+'</td>'
        +hist
        +'<td class="nofq1-num nofq1-now">'+seg(s1)+'</td>'
        +'<td class="nofq1-num">'+ch+'</td>'
        +'<td>'+(ov?'<span class="nofq1-ov">Applied</span>':'<span class="nofq1-fl">-</span>')+'</td></tr>');
    });
    body.innerHTML=out.join("");
    empty.style.display = shown?"none":"block";
    cnt.textContent = shown+" of "+NOFQ1[cur].n+" trusts";
  }
  q.addEventListener("input",render); f.addEventListener("change",render);
  render();
})();
</script></body></html>
