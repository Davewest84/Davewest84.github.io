<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;font-family:Arial,sans-serif;">

<h2 style="font-size:18px;font-weight:500;color:#111;margin:1rem 0 0;">How NHS trust deficits are expected to reduce over time</h2>

<style>
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:1rem 0 0.5rem;font-size:12px;color:#555;}
.legend span{display:flex;align-items:center;gap:5px;}
.ls{width:12px;height:12px;border-radius:2px;display:inline-block;}
.tip{position:absolute;background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:210px;font-family:Arial,sans-serif;}
.tip-title{font-weight:500;font-size:13px;color:#111;margin-bottom:6px;border-bottom:0.5px solid #e0e0e0;padding-bottom:6px;}
.tip-row{display:flex;justify-content:space-between;gap:16px;padding:2px 0;color:#555;}
.tip-row span:last-child{font-weight:500;color:#111;}
@media(prefers-color-scheme:dark){
  body{background:transparent;}
  h2{color:#f0f0f0!important;}
  .legend{color:#aaa;}
  .tip{background:#1e1e1e;border-color:#444;color:#f0f0f0;}
  .tip-title{color:#f0f0f0;border-bottom-color:#444;}
  .tip-row{color:#aaa;}
  .tip-row span:last-child{color:#f0f0f0;}
}
</style>

<div class="legend">
  <span><span class="ls" style="background:#D85A30;"></span>2025-26 forecast</span>
  <span><span class="ls" style="background:#378ADD;"></span>2026-27 plan limit</span>
  <span><span class="ls" style="background:#7F77DD;"></span>2027-28 plan limit</span>
  <span><span class="ls" style="background:#1D9E75;"></span>2028-29 plan limit</span>
</div>

<div style="position:relative;">
  <div style="position:relative;width:100%;height:520px;">
    <canvas id="nhsChart" role="img" aria-label="Grouped bar chart of NHS trust deficits across four years. All values are negative representing deficits in £m. Bars closer to zero indicate smaller deficits.">NHS trust deficit data 2025-26 to 2028-29 for 22 trusts, all values negative.</canvas>
  </div>
  <div class="tip" id="nhsTip"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  var DATA=[
    {t:"Mid & South Essex",v:[-115,-48.6,-20.4,0]},
    {t:"East Kent Hospitals",v:[-82,-40.0,-21.8,-3.6]},
    {t:"Medway",v:[-79.6,-32.9,-24.0,-15.0]},
    {t:"King's College Hospital",v:[-75,-44.5,-14.0,0]},
    {t:"UH Leicester",v:[-64.8,-57.4,-29.2,-1.0]},
    {t:"Northern Care Alliance",v:[-57.9,-28.8,0,0]},
    {t:"Liverpool UH",v:[-56.6,-26.8,-7.5,0]},
    {t:"Worcestershire Acute",v:[-47.3,-34.7,-22.1,-9.6]},
    {t:"Shrewsbury & Telford",v:[-45.1,-30.5,-19.2,-7.8]},
    {t:"Stockport",v:[-43.2,-34.4,-25.5,-16.7]},
    {t:"Royal Free London",v:[-42.7,-10.5,0,0]},
    {t:"St Helens & Knowsley",v:[-41.0,-16.8,-0.2,0]},
    {t:"Mid Cheshire",v:[-39.4,-24.4,-16.7,-9.0]},
    {t:"Kettering General",v:[-38.8,-24.4,-16.6,-8.7]},
    {t:"Tameside & Glossop",v:[-31.8,-30.2,-18.6,-12.0]},
    {t:"Liverpool Women's",v:[-31.0,-20.2,-15.2,-10.1]},
    {t:"N Cumbria Integrated",v:[-30.5,-13.9,-4.0,0]},
    {t:"Lancashire Teaching",v:[-30.0,-9.2,0,0]},
    {t:"South Tees",v:[-20.9,0,0,0]},
    {t:"Gateshead Health",v:[-12.0,-3.0,0,0]},
    {t:"Ashford & St Peter's",v:[-6.7,0,0,0]},
    {t:"County Durham & Darlington",v:[-2.0,0,0,0]}
  ];
  var YEARS=['2025-26 forecast','2026-27 plan limit','2027-28 plan limit','2028-29 plan limit'];
  var COLORS=['#D85A30','#378ADD','#7F77DD','#1D9E75'];
  var datasets=YEARS.map(function(yr,yi){
    return{
      label:yr,
      data:DATA.map(function(d){return d.v[yi];}),
      backgroundColor:COLORS[yi]+'cc',
      borderColor:COLORS[yi],
      borderWidth:1,
      borderRadius:2
    };
  });
  var ctx=document.getElementById('nhsChart');
  new Chart(ctx,{
    type:'bar',
    data:{labels:DATA.map(function(d){return d.t;}),datasets:datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          enabled:false,
          external:function(context){
            var tip=document.getElementById('nhsTip');
            if(context.tooltip.opacity===0){tip.style.display='none';return;}
            var ti=context.tooltip.dataPoints[0].dataIndex;
            var trust=DATA[ti];
            var html='<div class="tip-title">'+trust.t+'</div>';
            YEARS.forEach(function(yr,yi){
              var v=trust.v[yi];
              html+='<div class="tip-row"><span style="color:'+COLORS[yi]+'">'+yr+'</span><span>-£'+Math.abs(v).toFixed(1)+'m</span></div>';
            });
            tip.innerHTML=html;
            tip.style.display='block';
            var rect=ctx.getBoundingClientRect();
            var par=ctx.parentElement.parentElement;
            var parRect=par.getBoundingClientRect();
            var x=context.tooltip.caretX+(rect.left-parRect.left);
            var y=context.tooltip.caretY+(rect.top-parRect.top);
            if(x+230>parRect.width)x=x-230;
            tip.style.left=x+'px';
            tip.style.top=Math.max(0,y-20)+'px';
          }
        }
      },
      scales:{
        x:{
          ticks:{font:{size:10},color:'#666',autoSkip:false,maxRotation:50,minRotation:40},
          grid:{display:false}
        },
        y:{
          max:0,
          title:{display:true,text:'£m deficit (closer to zero = smaller deficit)',font:{size:11},color:'#666'},
          ticks:{font:{size:11},color:'#666',callback:function(v){return'-£'+Math.abs(v)+'m';}},
          grid:{color:'rgba(128,128,128,0.1)'}
        }
      }
    }
  });
})();
</script>

</body>
</html>
